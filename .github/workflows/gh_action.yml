name: Runs dependency installs and test script on dynamically provisioned gh runners
# v1
on: [push]

jobs:
  complete-lifecycle:
    #runs-on: ubuntu-latest # For GH Runners, not self-hosted
    runs-on: self-hosted
    continue-on-error: true # ALL jobs need this to reach runner hook's lifecycle
    environment: public 
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
## The id-token above plus the commented steps below gives GH actions
## the creds to do AWS stuff using any runner, with or without TLC
## Terraform (tf-files) or whether it is self-hosted or not.
## However, when provisioning the gh runner with tf-files,
## you do not need the aws-actions module because we already 
## attached the 'spot_instance_role' via the runner's instance profile.
#      - name: Checkout repository
#        uses: actions/checkout@v4
#      - name: Configure AWS Credentials
#        uses: aws-actions/configure-aws-credentials@v5
#        with:
#          # Use an AWS role in your account with suitable permissions, if not the one below
#          # Manually enter the ACCOUNT_ID value in GH Secrets or update in tf-files/main.tf
#          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/spot_instance_role
#          aws-region: us-east-1

      - name: Install Dependencies Required to Complete Dynamic Provisioning Lifecycle
        run: |
             if ! command /home/gh-runner/aws/dist/aws --version 2> /dev/null
             then
                cd /home/gh-runner/          
                curl  -o awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
                python -m zipfile -e awscliv2.zip .
                chmod 755 /home/gh-runner/aws/dist/aws
                # To disable (ie break) automatic instance termination in 
                # the instance lifecycle, change '-b ~/bin' to another PATH
                bash ./aws/install -i ~/aws-cli -b ~/bin
                chmod 755 /home/gh-runner/bin/aws
                /home/gh-runner/bin/aws --version
                env
             else
                echo "AWS CLI is already installed, printing AWSCLI version and env vars..."
                /home/gh-runner/aws/dist/aws --version
             fi
#  Replace the step below with the step(s) in your actual workflow
      - name: Run Python shell commands to check os and node name, then sleep 5 seconds
        shell: python
        run:  |
           import platform; import time; print(platform.platform()); print(platform.node()); time.sleep(5);

      - name: Update OS Packages
        run: |
          echo "Updating Operating System via DNF..."
          sudo dnf clean all
          sudo dnf update -y --refresh

      - name: Upgrade GitHub Actions Runner Software
        run: |
          echo "Checking and upgrading runner client software..."
          # Fetch latest runner version from GitHub API
          LATEST_VERSION=$(curl -s https://github.com | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          CURRENT_VERSION=$(./config.sh --version 2>/dev/null || echo "0.0.0")
          
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "Upgrading runner from $CURRENT_VERSION to $LATEST_VERSION"
            # Standard Actions Runner download/extract pattern
            # mkdir -p actions-runner && cd actions-runner
            curl -o actions-runner-linux-x64-${LATEST_VERSION}.tar.gz -L https://github.com{LATEST_VERSION}/actions-runner-linux-x64-${LATEST_VERSION}.tar.gz
            tar xzf ./actions-runner-linux-x64-${LATEST_VERSION}.tar.gz
            # Re-install dependencies if required by new versions
            sudo ./bin/installdependencies.sh
          else
            echo "Runner client is already up to date ($CURRENT_VERSION)."
          fi

      - name: Generalize and Create New AMI
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Gathering instance metadata..."
          TOKEN=$(curl -s -X PUT "http://169.254.169" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          AMI_NAME="TechnologyLeadershipGHR-${TIMESTAMP}"
          
          echo "Deprovisioning instance to generalize OS..."
          # Cleans users and network artifacts so the AMI is safely reusable
          sudo waagent -deprovision+user -force
          
          echo "Triggering asynchronous AMI creation for Instance: $INSTANCE_ID..."
          # --no-reboot permits the instance to finish sending this API command before AWS freezes it
          aws ec2 create-image --instance-id "$INSTANCE_ID" --name "$AMI_NAME" --description "Monthly patched GHR Oracle Linux 9 AMI"

#  Lifecycle termination of node at job completion is an 'adminstrator' function controlled
#  via ACTIONS_RUNNER_HOOK_JOB_COMPLETED and not available to workflows for 'security reasons' 
