name: Runs dependency installs and test script on dynamically provisioned gh runners
# v1
on: [push]

jobs:
  complete-lifecycle:
    #runs-on: ubuntu-latest # For GH Runners, not self-hosted
    runs-on: self-hosted
    continue-on-error: true # ALL jobs need this to reach runner hook's lifecycle
    environment: public 
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
## The id-token above plus the commented steps below gives GH actions
## the creds to do AWS stuff using any runner, with or without TLC
## Terraform (tf-files) or whether it is self-hosted or not.
## However, when provisioning the gh runner with tf-files,
## you do not need the aws-actions module because we already 
## attached the 'spot_instance_role' via the runner's instance profile.
#      - name: Checkout repository
#        uses: actions/checkout@v4
#      - name: Configure AWS Credentials
#        uses: aws-actions/configure-aws-credentials@v5
#        with:
#          # Use an AWS role in your account with suitable permissions, if not the one below
#          # Manually enter the ACCOUNT_ID value in GH Secrets or update in tf-files/main.tf
#          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/spot_instance_role
#          aws-region: us-east-1

      - name: Install Dependencies Required to Complete Dynamic Provisioning Lifecycle
        run: |
                cd /home/gh-runner/          
                [ ! -e "/home/gh-runner/bin/aws" ] && curl -C - -o awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
                [ ! -e "/home/gh-runner/bin/aws" ] && python -m zipfile -e awscliv2.zip .
                chmod 755 /home/gh-runner/aws/dist/aws
                # To disable (ie break) automatic instance termination in 
                # the instance lifecycle, change '-b ~/bin' to another PATH
                bash ./aws/install -i ~/aws-cli -b ~/bin --update
                ln -s /home/gh-runner/aws-cli/v2/current/dist/aws /home/gh-runner/bin/aws || true
                chmod 755 /home/gh-runner/bin/aws
                [ -e "/home/gh-runner/bin/aws" ] && /home/gh-runner/bin/aws --version

#  Replace the step below with the step(s) in your actual workflow
      - name: Run Python shell commands to check os and node name, then sleep 3 seconds
        shell: python
        run:  |
               import platform; import time; print(platform.platform()); print(platform.node()); time.sleep(3);
      - name: Run bash shell and print a command out
        continue-on-error: true 
        shell: bash
        run:  |
               date
               sudo firewall-cmd --permanent --add-port=6443/tcp
               sudo firewall-cmd --permanent --add-port=443/tcp
               sudo firewall-cmd --permanent --add-port=8080/tcp
               sudo firewall-cmd --reload
               TOKEN=$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
               IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" 169.254.169.254/latest/meta-data/public-ipv4)
               FQDN=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" 169.254.169.254/latest/meta-data/public-hostname)
               echo "Configuring Kubernetes access to IP address $IP with HTTPS access via $FQDN"
               curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x ./kubectl && sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
               curl -sfL https://get.k3s.io | sh -s - server --tls-san $IP
               sudo systemctl start k3s
               sudo mkdir /root/.kube /home/gh-runner/.kube/ || true
               sudo cp /etc/rancher/k3s/k3s.yaml /root/.kube/config
               sudo cp /etc/rancher/k3s/k3s.yaml /home/gh-runner/.kube/config
               sudo chown -R gh-runner:gh-runner /home/gh-runner/.kube
               # Make k3s.yaml available for download to end-user
               sudo cp /etc/rancher/k3s/k3s.yaml /tmp
               # Make users' k3s.yaml use public IP
               sudo sed -i "s/127.0.0.1/$IP/g" /tmp/k3s.yaml
               sudo chmod 777 /tmp/k3s.yaml
               # Ready node takes ~30 seconds 
               sleep 15
               sudo bash -c "/usr/local/bin/kubectl get node"
              # sudo bash -c "/usr/local/bin/kubectl -n kube-system patch deploy metrics-server --type='json' -p '[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"key": "CriticalAddonsOnly", "operator": "Exists"}}]'"
               curl -C - -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
               chmod 777 get_helm.sh
               [ ! -f "/usr/local/bin/helm" ] && ./get_helm.sh ||true

      - name: Checkout k8s app
        uses: actions/checkout@v4
        with:
          repository: AndrewSimon/kubernetes-dashboard
          path: kubernetes-dashboard
          token: ${{ secrets.GH_PAT }} 

      - name: Run Helm Headlamp install
        continue-on-error: true      
        shell: bash
        run:  |
               TOKEN=$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
               export FQDN=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" 169.254.169.254/latest/meta-data/public-hostname)    
 
               /usr/local/bin/helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ 
               /usr/local/bin/helm repo update
               /usr/local/bin/helm upgrade --install headlamp headlamp/headlamp --namespace kube-system --set service.type=NodePort --set service.port=80
               /usr/local/bin/kubectl patch svc headlamp -n kube-system --type='json' -p='[{"op": "replace", "path": "/spec/ports/0/nodePort", "value": 30443}]'
               echo "Copy the key below, using a browser navigate to https://$FQDN:30443, and paste it into token text box"
               echo ""
               /usr/local/bin/kubectl create token my-headlamp --namespace kube-system
#      - name: Run Helm kubernetes-dashboard install
#        continue-on-error: true      
#        shell: bash
#        run:  |
#               # Clean up k3s metrics-server as we'll use k8s-app's instead
#               /usr/local/bin/kubectl delete sa metrics-server -n kube-system || true
#               /usr/local/bin/kubectl delete ClusterRole system:aggregated-metrics-reader -n kube-system || true       
#               /usr/local/bin/kubectl delete ClusterRole system:metrics-server -n kube-system || true
#               /usr/local/bin/kubectl delete ClusterRoleBinding metrics-server:system:auth-delegator -n kube-system || true
#               /usr/local/bin/kubectl delete ClusterRoleBinding system:metrics-server || true
#               /usr/local/bin/kubectl delete RoleBinding metrics-server-auth-reader -n kube-system || true
#               /usr/local/bin/kubectl delete svc metrics-server -n kube-system || true
#               /usr/local/bin/kubectl delete APIService v1beta1.metrics.k8s.io || true
#               /usr/local/bin/kubectl delete deploy -n kube-system metrics-server || true
#               /usr/local/bin/helm delete k8s-app -n kubernetes-dashboard  || true
#               /usr/local/bin/helm upgrade --install k8s-app kubernetes-dashboard/ --create-namespace -n kubernetes-dashboard  
#               sleep 2
#               /usr/local/bin/kubectl create clusterrolebinding kubernetes-dashboard-cluster-admin --clusterrole=cluster-admin --serviceaccount=kubernetes-dashboard:kubernetes-dashboard || true
#               /usr/local/bin/kubectl -n kubernetes-dashboard create token kubernetes-dashboard || true
      - name: Generate YAML Output
        id: create_yaml
        run: |
          TOKEN=$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
          export FQDN=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" 169.254.169.254/latest/meta-data/public-hostname)    
          # Define the YAML content using a heredoc
          YAML_CONTENT=$(cat <<-EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: k8s-app-ingress
            annotations:
              kubernetes.io/ingress.class: "traefik" 
          spec:
            rules:
              - host: $FQDN
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kubernetes-dashboard
                          port:
                            number: 443
          EOF
          )
          echo "$YAML_CONTENT" >> ./ingress.yaml
#          /usr/local/bin/kubectl -n kubernetes-dashboard apply -f ./ingress.yaml
         
#  Lifecycle termination of node at job completion is an 'adminstrator' function controlled
#  via ACTIONS_RUNNER_HOOK_JOB_COMPLETED and not available to workflows for 'security reasons' 
